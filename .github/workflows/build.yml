name: 构建

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            tags: ""
          - name: darwin-universal
            os: macos-latest
            platform: darwin/universal
            tags: ""

    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Linux 依赖安装
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: 构建
        run: |
          if [ -n "${{ matrix.tags }}" ]; then
            wails build -platform ${{ matrix.platform }} -tags ${{ matrix.tags }}
          else
            wails build -platform ${{ matrix.platform }}
          fi
        shell: bash

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: idcard-processor-${{ matrix.name }}
          path: build/bin/*
