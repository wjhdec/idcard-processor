name: 构建

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '手动触发时指定要发布到的 tag（如 v1.0.0）；推送 v* tag 时自动使用该 tag'
        required: false
        type: string

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            tags: ""
          - name: darwin-universal
            os: macos-latest
            platform: darwin/universal
            tags: ""

    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Linux 依赖安装
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: 构建
        run: |
          if [ -n "${{ matrix.tags }}" ]; then
            wails build -platform ${{ matrix.platform }} -tags ${{ matrix.tags }}
          else
            wails build -platform ${{ matrix.platform }}
          fi
        shell: bash

      # 重命名产物为带平台标识的文件名，避免各平台产物同名相互覆盖：
      # - Linux/Windows 直接重命名二进制
      # - macOS 输出是 .app 应用包，压缩为 .app.zip 作为 Release 资产
      - name: 重命名产物（含平台标识）
        shell: bash
        run: |
          cd build/bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv idcard-processor.exe idcard-processor-${{ matrix.name }}.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            app_dir="$(find . -maxdepth 1 -name '*.app' -print -quit)"
            if [ -z "$app_dir" ]; then
              echo "未找到 macOS .app 产物" >&2
              exit 1
            fi
            ditto -c -k --sequesterRsrc --keepParent "$app_dir" "idcard-processor-${{ matrix.name }}.app.zip"
            rm -rf "$app_dir"
          else
            mv idcard-processor idcard-processor-${{ matrix.name }}
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: idcard-processor-${{ matrix.name }}
          path: build/bin/*
          if-no-files-found: error

  # 把三平台产物挂到 GitHub Release 下载区
  # 触发条件：推送 v* tag（自动用当前 tag），或手动触发时指定 release_tag
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release 需要 git 仓库上下文（读取 .git 确定仓库），必须先检出代码
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 下载全部构建产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 确定目标 tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建/更新 Release 并上传产物
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== 待上传文件 =="
          ls -la artifacts/
          TAG="${{ steps.tag.outputs.tag }}"
          echo "== 目标 tag: ${TAG} =="
          if ! gh release create "${TAG}" artifacts/* --generate-notes; then
            gh release upload "${TAG}" artifacts/* --clobber
          fi
        shell: bash
